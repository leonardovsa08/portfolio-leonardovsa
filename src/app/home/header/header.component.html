<header
  class="fixed top-0 left-0 w-full h-20 md:h-24 z-50 bg-background-dark/50 backdrop-blur-md"
>
  <div class="relative z-10 h-full w-full flex items-center">
    <div class="w-full max-w-7xl mx-auto flex items-center justify-between lg:px-12 xl:px-20 px-6">

      <div class="flex items-center shrink-0 rounded-lg">
        <a href="#banner" aria-label="Ir para o início" class="relative group flex items-center gap-3">
          <span class="material-symbols-rounded text-[1.65rem] text-primary font-bold" aria-hidden="true">code</span>
          <span class="text-primary font-bold text-[1.65rem]">leonardo.vsa</span>
        </a>
      </div>

      <nav class="hidden lg:flex items-center gap-5 xl:gap-8 text-[0.95rem] xl:text-[1rem] font-medium text-white" aria-label="Seções da página">
        @for (link of links; track link.href) {
          <a [href]="link.href" class="relative text-white hover:text-primary transition-colors pb-1 whitespace-nowrap
              after:content-[''] after:absolute after:left-0 after:bottom-0
              after:w-0 after:h-[2px] after:bg-primary
              after:transition-all after:duration-300
              hover:after:w-full">
            {{ link.label }}
          </a>
        }
      </nav>

      <div class="lg:hidden flex items-center">
        <button
          #menuButton
          type="button"
          (click)="toggleMenu()"
          class="text-slate-300 hover:text-white p-2 rounded-md transition-colors"
          [attr.aria-expanded]="isMenuOpen"
          aria-controls="mobile-menu"
          [attr.aria-label]="isMenuOpen ? 'Fechar menu' : 'Abrir menu'"
        >
          @if (isMenuOpen) {
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          } @else {
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          }
        </button>
      </div>

    </div>
  </div>

  @if (isMenuOpen) {
    <div
      class="fixed inset-0 z-40 lg:hidden
      bg-black/40 backdrop-blur-sm
      transition-all duration-300 ease-out
      animate-[fadeIn_.3s_ease-out]"
      aria-hidden="true"
      (click)="closeMenu(true)"
    ></div>
  }

  @if (isMenuOpen) {
    <div
      class="lg:hidden fixed left-0 top-20 md:top-24 h-[calc(100dvh-5rem)] md:h-[calc(100dvh-6rem)] w-full z-50
      bg-background-dark/95 backdrop-blur-xl
      border-t border-white/10
      shadow-2xl
      transition-all duration-300 ease-out
      animate-[fadeIn_.3s_ease-out]"
      id="mobile-menu"
      role="dialog"
      aria-modal="true"
      aria-label="Menu"
    >
      <nav id="mobile-nav" class="flex flex-col justify-center items-center h-full gap-8 px-6" aria-label="Seções da página">
        @for (link of links; track link.href) {
          <a (click)="closeMenu(true)" [href]="link.href"
            class="group relative text-xl font-semibold tracking-wide text-white
            transition-all duration-300
            hover:text-primary active:scale-95">
            {{ link.label }}
            <span class="absolute -bottom-2 left-1/2 w-0 h-[2px] bg-primary
              transition-all duration-300
              group-hover:w-full group-hover:left-0"></span>
          </a>
        }
      </nav>
    </div>
  }
</header>
