<section class="relative text-white py-28 overflow-hidden" aria-labelledby="skills-title">

    <div class="absolute inset-0 opacity-[0.05] bg-grid-pattern bg-[size:40px_40px]" aria-hidden="true"></div>

    <div class="relative max-w-7xl mx-auto px-8 lg:px-16">

        <div class="text-center mb-20" data-aos="fade-down" data-aos-duration="1500">

            <h2 id="skills-title" class="text-4xl md:text-5xl font-bold text-white tracking-wide">
                Habilidades de <span class="text-primary">Desenvolvimento</span>
            </h2>

            <p class="text-gray-400 mt-6 max-w-2xl mx-auto leading-relaxed">
                O que uso no dia a dia no front-end e no Git, e o que estou estudando agora.
            </p>

        </div>

        <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-10">

            @for (skill of skills; track skill.name) {
                <div [attr.data-aos]="skill.aos" data-aos-duration="1500" class="w-full">
                    <div class="group relative p-8 rounded-2xl h-full flex flex-col
                        border border-white/5
                        bg-surface-dark/30 backdrop-blur-sm hover:bg-background-dark
                        transition-all duration-500
                        hover:-translate-y-3
                        hover:border-primary/40
                        hover:shadow-[0_20px_60px_rgba(0,0,0,0.5)]
                        overflow-hidden">

                        <div class="pointer-events-none absolute inset-0
                            opacity-0 group-hover:opacity-100
                            transition-opacity duration-500 rounded-2xl"
                            style="background: radial-gradient(circle at top right, rgba(255,90,0,0.25), transparent 70%);">
                        </div>

                        <div class="w-12 h-12 flex items-center justify-center border border-primary rounded-full text-primary transition duration-500 mb-6">
                            @if (skill.image) {
                                <img [src]="skill.image" [alt]="skill.name" width="32" height="32" loading="lazy" decoding="async" [class]="(skill.imageClass ?? 'w-6 h-6') + ' object-contain group-hover:scale-110 transition duration-300'" />
                            } @else {
                                <span class="material-symbols-rounded text-2xl group-hover:scale-110 transition duration-300" aria-hidden="true">{{ skill.icon }}</span>
                            }
                        </div>

                        <h3 class="text-lg font-semibold tracking-wide">
                            {{ skill.name }}
                        </h3>

                        <p class="text-gray-400 mt-4 text-sm leading-relaxed">
                            {{ skill.description }}
                        </p>

                        <div class="mt-auto pt-6">
                            <div class="w-full h-1 bg-white/10 rounded-full overflow-hidden"
                                role="progressbar"
                                [attr.aria-valuenow]="skill.level"
                                aria-valuemin="0"
                                aria-valuemax="100"
                                [attr.aria-label]="skill.name">
                                <div class="h-full bg-primary" [style.width.%]="skill.level"></div>
                            </div>
                            <span class="text-primary text-xs mt-2 block text-right">{{ skill.level }}%</span>
                        </div>

                    </div>
                </div>
            }

        </div>

    </div>

</section>
